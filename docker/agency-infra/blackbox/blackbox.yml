modules:
  # Standard web probe: 2xx response, valid TLS, within 5s.
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [] # empty = any 2xx
      method: GET
      follow_redirects: true
      # Docker networks usually have no IPv6 route; without this the probe can pick an
      # AAAA record and fail with "network is unreachable" even though the site is up.
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true

  # Same, but without certificate verification (only for debugging a broken chain).
  http_2xx_insecure:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: []
      method: GET
      follow_redirects: true
      # Docker networks usually have no IPv6 route; without this the probe can pick an
      # AAAA record and fail with "network is unreachable" even though the site is up.
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true
      tls_config:
        insecure_skip_verify: true
