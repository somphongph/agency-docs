global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Synthetic checks: blackbox_exporter performs the request and exposes
  # probe_success / probe_duration_seconds / probe_http_status_code /
  # probe_ssl_earliest_cert_expiry. Targets live in targets/blackbox.yml.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.yml"]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Whitebox metrics from Spring Boot Actuator (JVM, HTTP, Tomcat, custom SSE).
  # host.docker.internal works for a locally running API; switch to api:8080 if this
  # stack is attached to the agency-stack network.
  - job_name: agency-api
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ["host.docker.internal:8080"]
